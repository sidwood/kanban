[workspace]
resolver = "2"
members = [
    "crates/kanban-domain",
    "crates/kanban-dto",
    "crates/kanban-app",
    "crates/kanban-storage",
    "crates/kanban-transport",
    "crates/kanban-herdr",
    "crates/kanban-mcp",
    "crates/kanban-service",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
publish = false

[workspace.dependencies]
schemars = { version = "0.8.22", features = ["derive"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
kanban-dto = { path = "crates/kanban-dto" }

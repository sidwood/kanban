[package]
name = "kanban-desktop"
version = "0.1.0"
description = "Thin Tauri shell hosting the Kanban desktop application"
edition = "2024"
rust-version = "1.85.0"
license = "MIT"
publish = false
default-run = "kanban-desktop"

# The shell is deliberately outside the root Cargo workspace: the
# core is eight crates under crates/, and the shell is replaceable
# Tauri plumbing (ADR-0001, docs/architecture/repository.md).
[workspace]

[lib]
name = "kanban_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Release-profile probe for core-binary path-resolution tests.
[[bin]]
name = "core-binary-probe"
path = "src/bin/core_binary_probe.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "6.0.0"
kanban-dto = { path = "../../../crates/kanban-dto" }
kanban-transport = { path = "../../../crates/kanban-transport" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tauri = { version = "2", features = [] }

[dev-dependencies]
kanban-app = { path = "../../../crates/kanban-app", features = ["test-support"] }
tauri = { version = "2", features = ["test"] }
tempfile = "3.27.0"

[package]
name = "kanban-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The in-memory idempotency store is a test double, not a shipped
# capability: only a dev-dependency may switch it on, so no release
# build of the core can contain it.
[features]
test-support = []

[dependencies]
kanban-domain = { workspace = true }
kanban-dto = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = "0.22.1"
sha2 = "0.10.9"

[[bin]]
name = "kanban-contracts-gen"
path = "src/bin/kanban-contracts-gen.rs"

[dev-dependencies]
tempfile = "3.27.0"
kanban-service = { path = "../kanban-service" }
kanban-storage = { path = "../kanban-storage" }
rusqlite = { version = "0.40.2", features = ["bundled"] }

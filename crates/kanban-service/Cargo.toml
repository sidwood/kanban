[package]
name = "kanban-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
kanban-app = { workspace = true }
kanban-domain = { workspace = true }
kanban-dto = { workspace = true }
kanban-herdr = { path = "../kanban-herdr" }
kanban-storage = { workspace = true }
kanban-transport = { workspace = true }
kanban-mcp = { path = "../kanban-mcp" }
libc = "0.2"
sha2 = "0.10.9"
socket2 = "0.6.5"
serde_json = { workspace = true }
thiserror = "2.0.20"
time = { workspace = true }
zeroize = "1.9.0"

[target.'cfg(target_os = "macos")'.dependencies]
mac-usernotifications = "0.3.1"
security-framework = { version = "3.7.0", default-features = false, features = ["OSX_10_14"] }

[dev-dependencies]
# cspell:ignore httparse
httparse = "1.10.1"
# Snapshot coordination is absent from normal production builds.
kanban-storage = { workspace = true, features = ["test-support"] }
# The herdr fixture reaches this crate only through this dev-dependency
# edge: production builds of kanban-service never enable it.
kanban-herdr = { path = "../kanban-herdr", features = ["test-support"] }
# The timeline integration test writes a row the typed envelope
# cannot express, to prove the read path refuses it.
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = { workspace = true }
tempfile = "3.27.0"

[[test]]
name = "lifecycle_startup"
path = "tests/lifecycle_startup.rs"
harness = false

[[test]]
name = "lifecycle_workers"
path = "tests/lifecycle_workers.rs"
harness = false

[[test]]
name = "lifecycle_process"
path = "tests/lifecycle_process.rs"
harness = false

[[test]]
name = "loopback_process"
path = "tests/loopback_process.rs"
harness = false

[[test]]
name = "git_observer_failed_status"
path = "tests/git_observer_failed_status.rs"
harness = false
